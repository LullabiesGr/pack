name: Theme Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout theme
        uses: actions/checkout@v4

      - name: Validate Liquid theme
        uses: shopify/theme-check-action@v2
        with:
          theme_root: .
          token: ${{ github.token }}
          base: main
